{% extends "base.html" %}
{% block title %}Bereits abgegeben{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Bereits abgegeben</h1>
  <p>Für diese Sitzung liegt bereits eine verbindliche Abgabe vor.</p>

</section>
{% endblock %}
